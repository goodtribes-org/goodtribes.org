apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "goodtribes.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      {{- include "goodtribes.selectorLabels" "redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goodtribes.selectorLabels" "redis" | nindent 8 }}
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # allowPrivilegeEscalation:false is always safe. Not runAsNonRoot:
          # this command bypasses the official image's own entrypoint
          # (which normally handles dropping to a non-root user), and there's
          # no PVC here to worry about chown-ing — likely safe to harden
          # further, but unverified against this specific image tag without
          # live testing, so left for a human with cluster access to confirm.
          securityContext:
            allowPrivilegeEscalation: false
          # Run through a shell so $REDIS_PASSWORD is expanded by sh, not by
          # Kubernetes. K8s only substitutes $(VAR) from the container's `env`
          # list — never from `envFrom` — so the previous $(REDIS_PASSWORD) form
          # was passed through literally and Redis came up with "$(REDIS_PASSWORD)"
          # as its actual password.
          command:
            - sh
            - -c
            - 'exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no'
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            {{- range $key, $value := .Values.redis.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Probes need the same treatment: $(VAR) is never expanded in exec
          # probe commands at all. Grep for PONG so a wrong password fails the
          # probe instead of passing on redis-cli's zero exit code.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 20
