apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-meilisearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "goodtribes.labels" . | nindent 4 }}
    app.kubernetes.io/name: meilisearch
spec:
  replicas: {{ .Values.meilisearch.replicaCount }}
  # See the comment on the postgres Deployment's strategy — same reasoning:
  # a single ReadWriteOnce PVC can't be mounted by an old and new pod at
  # once, so Recreate is the correct choice, not an oversight.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "goodtribes.selectorLabels" "meilisearch" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goodtribes.selectorLabels" "meilisearch" | nindent 8 }}
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: meilisearch
          image: "{{ .Values.meilisearch.image.repository }}:{{ .Values.meilisearch.image.tag }}"
          imagePullPolicy: {{ .Values.meilisearch.image.pullPolicy }}
          # See the comment on the postgres Deployment's securityContext —
          # same reasoning: allowPrivilegeEscalation:false is always safe,
          # but this image's handling of its mounted PVC on first boot is
          # unverified without live testing, so runAsNonRoot/capability
          # drops are left for a human with cluster access.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 7700
              protocol: TCP
          resources:
            {{- toYaml .Values.meilisearch.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            {{- range $key, $value := .Values.meilisearch.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: goodtribes-meilisearch
