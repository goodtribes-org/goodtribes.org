apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "goodtribes.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  # Recreate, not RollingUpdate, is intentional here: a single replica with a
  # ReadWriteOnce PVC can't have an old and new pod both mount the volume at
  # once, so a rolling update would just fail to schedule the new pod anyway.
  # Recreate makes the resulting brief outage on every rollout explicit
  # instead of surfacing as a confusing stuck deployment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "goodtribes.selectorLabels" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goodtribes.selectorLabels" "postgres" | nindent 8 }}
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              protocol: TCP
          # Deliberately NOT runAsNonRoot, NOT readOnlyRootFilesystem, and NOT
          # dropping capabilities: the official postgres image's entrypoint
          # runs as root on first boot specifically to chown/initdb the
          # mounted PVC (needs CAP_CHOWN/CAP_DAC_OVERRIDE, which a blanket
          # capability drop would remove even from root) — untested against
          # this cluster's actual PVC state, so not safe to guess at blind.
          # allowPrivilegeEscalation:false is the one hardening flag that's
          # always safe regardless (it only blocks gaining NEW privileges via
          # e.g. a setuid binary, never removes what the process already has).
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            {{- range $key, $value := .Values.postgres.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - goodtribes
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - goodtribes
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: goodtribes-postgres
