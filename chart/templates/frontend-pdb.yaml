{{- /*
Only render once more than one replica can actually exist. A PDB with
minAvailable: 1 against a single-replica Deployment would block every
voluntary eviction (node drain, cluster upgrade) — Kubernetes won't evict
the only pod if doing so drops available replicas below the budget — so at
today's default (replicaCount: 1, autoscaling off) this would silently make
node drains hang instead of protecting anything.
*/ -}}
{{- if or .Values.frontend.autoscaling.enabled (gt (.Values.frontend.replicaCount | int) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: goodtribes-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "goodtribes.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "goodtribes.selectorLabels" "frontend" | nindent 6 }}
{{- end }}
