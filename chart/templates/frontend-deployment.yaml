apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "goodtribes.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "goodtribes.selectorLabels" "frontend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goodtribes.selectorLabels" "frontend" | nindent 8 }}
    spec:
      # Nothing in this pod talks to the Kubernetes API — the auto-mounted
      # default-ServiceAccount token would be unused attack surface.
      automountServiceAccountToken: false
      # Matches the Dockerfile's own `USER nextjs` (uid/gid 1001) exactly —
      # this is defense-in-depth confirming what the image already does,
      # not a behavior change: entrypoint.sh only runs `prisma migrate
      # deploy` then execs node, neither needs root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Unconditional as of the ResourceQuota/LimitRange addition below —
          # a namespace ResourceQuota scoping requests.cpu/requests.memory
          # rejects any pod that omits a request outright, so this could no
          # longer stay gated behind autoscaling.enabled without breaking
          # scheduling entirely. Previously only applied when autoscaling
          # was on (to avoid silently changing the single-replica
          # deployment's QoS class) — that concern is now moot since every
          # pod needs a request either way.
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # EMERGENCY REVERT 2026-08-23: readiness was pointed at /api/health
          # (DB+Redis check) for one deploy cycle. That makes ALL frontend
          # pods NotReady whenever DB/Redis is unreachable for any reason,
          # which drops the Service to zero endpoints and makes Traefik
          # return its generic "no route" 404 for every path — indistinguishable
          # from a routing outage from the outside, and it happened right
          # after this went live. Reverted to "/" (plain process-alive check)
          # to restore traffic while the actual DB/Redis reachability issue
          # is root-caused with real cluster access. Re-apply the DB+Redis
          # readiness check once that's confirmed fixed — see CLAUDE.md.
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
