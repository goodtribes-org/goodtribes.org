apiVersion: apps/v1
kind: Deployment
metadata:
  name: goodtribes-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "goodtribes.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "goodtribes.selectorLabels" "frontend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goodtribes.selectorLabels" "frontend" | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
          {{- if .Values.frontend.autoscaling.enabled }}
          # Only set when autoscaling is on: the HPA's CPU-utilization target
          # is meaningless without a request to compute a percentage against,
          # and setting this unconditionally would silently change every
          # existing deployment's QoS class even with autoscaling off.
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: goodtribes-secret
          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Readiness checks DB+Redis (/api/health) so traffic routes away from
          # a pod whose dependencies are broken. Liveness deliberately stays on
          # "/" — a plain process-alive check — because if it also checked
          # DB/Redis, a downstream outage would get every frontend pod killed
          # and restarted in a loop, which fixes nothing and adds a restart
          # storm on top of the outage.
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
