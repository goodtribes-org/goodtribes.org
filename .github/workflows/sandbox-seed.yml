name: Sandbox Seed

on:
  schedule:
    # Weekly (Mondays) at 07:00 UTC — reduced from daily 2026-09-29 while
    # running on a capped Vertex AI credit balance (see CLAUDE.md's AI
    # provider note); the route itself also caps to once per ~20h now
    # regardless of this schedule.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sandbox-seed endpoint
        run: |
          curl -sf --max-time 120 -X POST "${{ vars.APP_URL }}/api/cron/sandbox-seed" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
