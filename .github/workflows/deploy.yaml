name: Deploy To Production

on:
  workflow_run:
    workflows: [Docker Publish]
    types:
      - completed

# One deploy at a time. Merging several PRs in a row fires one Docker Publish
# per commit and so one deploy per build; run in parallel they raced each
# other's push to goodtribes-org/deploy ("rejected ... fetch first", seen
# 2026-09-30 when #145–#154 were merged back to back). Queued, not cancelled:
# a newer deploy waiting in the group replaces an older one still pending,
# and the stale-build check below skips any that are no longer main's tip.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Docker Publish only pushes the image to ghcr.io when its own trigger
    # wasn't a pull_request (docker-image.yml's `push: ${{ github.event_name
    # != 'pull_request' }}`). Without this guard, a successful PR build also
    # fires this job, which then commits a manifest pointing at an image tag
    # that was never pushed — ArgoCD/Flux then tries to pull a nonexistent
    # tag with no rollback.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    # Neither packages: write nor id-token: write are actually used here —
    # this job renders the chart and pushes to the goodtribes-org/deploy
    # repo over SSH (DEPLOY_KEY), it never touches ghcr.io packages or an
    # OIDC token. Trimmed to just what checkout needs.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only deploy the build of main's current tip. Builds finish out of
      # order, and the image tag below is the triggering build's commit, so
      # an older build finishing last would roll the manifest back to an
      # older image. Skipping it is safe: main's tip has its own build, which
      # deploys when it finishes. This also keeps the chart (checked out
      # above from main's tip) and the image tag from the same commit.
      - name: Skip if this build is no longer main's tip
        id: freshness
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$BUILD_SHA" != "$MAIN_SHA" ]; then
            echo "::notice::Skipping deploy of $BUILD_SHA: main is now at $MAIN_SHA, whose own build deploys it."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Manifest
        if: steps.freshness.outputs.stale != 'true'
        uses: actions/checkout@v7
        with:
          repository: goodtribes-org/deploy
          ref: main
          path: manifest
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy
        if: steps.freshness.outputs.stale != 'true'
        uses: WyriHaximus/github-action-helm3@v4
        with:
          exec: |
            if [ ! -d "chart" ]; then
              echo "::error::Chart directory not found"
              exit 1
            fi
            helm template chart/ \
              --set frontend.image.tag=${{ github.event.workflow_run.head_sha }} \
              --set-string ghcrPullSecretData=${{ secrets.GHCR_PULL_SECRET }} \
              > manifest/goodtribes/goodtribes.yaml
            cat manifest/goodtribes/goodtribes.yaml

      - name: GIT commit and push all changed files
        if: steps.freshness.outputs.stale != 'true'
        env:
          CI_COMMIT_MESSAGE: Continuous Integration Build Artifacts
          CI_COMMIT_AUTHOR: Continuous Integration
        run: |
          cd manifest
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "username@users.noreply.github.com"
          git add goodtribes/goodtribes.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push

      - name: Apply to cluster
        if: steps.freshness.outputs.stale != 'true'
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "KUBECONFIG_DATA not set — skipping direct kubectl deploy"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl apply -f manifest/goodtribes/goodtribes.yaml
          kubectl rollout status deployment/goodtribes-frontend -n goodtribes --timeout=120s

