name: Docker Publish
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    # id-token: write was requested but never consumed (no OIDC/keyless-
    # signing step) — trimmed. packages: write is real: the last step PATCHes
    # the package's visibility via `gh api`. security-events: write is for
    # the Trivy scan's SARIF upload to the Security tab.
    permissions:
      contents: read
      packages: write
      security-events: write

    # Ephemeral Postgres for the integration-test step below — separate from
    # the deployed database entirely, torn down with the runner at job end.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goodtribes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --workspace=frontend prisma generate

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Test
        run: npm test --workspace=frontend --if-present

      # Applies every migration to the fresh service-container Postgres
      # above — this is the same replay mechanism production's entrypoint.sh
      # runs on every pod restart, so it's what actually catches a real
      # migration-ordering bug automatically (not just #61 — any future one).
      # Deliberately non-blocking (continue-on-error): known issue, this
      # fails today on a fresh database on PR #61's home-hero ordering bug
      # (held pending Mattias running `migrate resolve` against production —
      # see CLAUDE.md's "Known issues" and MATTIAS_TODO.md), and that one
      # already-tracked, already-blocked bug shouldn't gate every other
      # integration test in this suite. The next step reports it loudly as a
      # warning instead of silently swallowing it.
      - name: Apply migrations (integration test database)
        id: migrate_deploy
        continue-on-error: true
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goodtribes_test
        run: npx prisma migrate deploy

      - name: Warn if the real migration history didn't replay cleanly
        if: steps.migrate_deploy.outcome == 'failure'
        run: |
          echo "::warning::prisma migrate deploy failed on a fresh database. Likely PR 61's known home-hero migration-ordering bug (see CLAUDE.md Known Issues), or a NEW migration-ordering regression if PR 61 has already merged. Falling back to prisma db push so integration tests can still run, but the real migration history is NOT verified this run. Treat this warning as a real signal, not noise."

      # Whether or not the real migration history above replayed cleanly,
      # guarantee the test database matches the current schema before running
      # the suite. `db push` diffs schema.prisma directly onto the database
      # with no history replay at all, so it's unaffected by any ordering bug
      # — --force-reset makes it deterministic regardless of how far the
      # (possibly failed) migrate deploy above got. This step is what makes
      # the integration tests always runnable; it is NOT a substitute for the
      # migration-history check above, which stays the real regression test.
      - name: Sync test database schema (db push fallback)
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goodtribes_test
        run: npx prisma db push --force-reset

      - name: Integration tests
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goodtribes_test
        run: npm run test:integration

      # Third test layer, point 05 of the "Blueprint for GoodTribes"
      # architecture memo (see CLAUDE.md): real browser E2E, not mocked and
      # not just hitting the database directly. Runs `next dev` against the
      # same Postgres service container the integration tests just used
      # (already schema-synced by the db push step above) -- this is a
      # smoke suite (frontend/e2e/), not full production-parity E2E: no
      # Redis service (the app fails open on a Redis outage by design, see
      # CLAUDE.md's rate-limiting notes) and no Meilisearch (search-execution
      # is client-side against Meilisearch directly, not exercised by these
      # tests' initial page loads). A real deployed preview environment,
      # which the memo's own phrasing gestures at, doesn't exist in this
      # repo's infra yet -- this is the closest achievable approximation.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start dev server for E2E
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goodtribes_test
          AUTH_SECRET: e2e-ci-secret
          NEXTAUTH_URL: http://localhost:3000
          PORT: 3000
        run: |
          npm run dev > /tmp/e2e-dev-server.log 2>&1 &
          echo $! > /tmp/e2e-dev-server.pid
          timeout 60 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 1; done'

      - name: E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Stop dev server
        if: always()
        run: |
          kill "$(cat /tmp/e2e-dev-server.pid)" 2>/dev/null || true
          cat /tmp/e2e-dev-server.log || true

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      # Report-only for now (exit-code 0): this repo has never been
      # vulnerability-scanned before, so the current baseline is unknown —
      # failing the build on day one could block every deploy on
      # pre-existing findings nobody has triaged yet. Results land in the
      # Security tab; tightening this to a hard gate (exit-code: 1, maybe
      # severity-scoped to CRITICAL first) is a follow-up once that baseline
      # is known. Only runs on the push path (image is pushed to ghcr.io,
      # not just built) — PR builds aren't loaded locally, so there's
      # nothing to scan there yet.
      - name: Scan image for vulnerabilities (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Make frontend package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            /orgs/goodtribes-org/packages/container/goodtribes.org%2Ffrontend \
            -f visibility=public || true
