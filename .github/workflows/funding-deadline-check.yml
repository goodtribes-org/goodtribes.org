name: Funding Deadline Check

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deadline-check endpoint
        run: |
          curl -sf --max-time 120 -X POST "${{ vars.APP_URL }}/api/cron/funding-deadline-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
